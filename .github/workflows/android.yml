name: Android CI

on:
  push:
    branches: [main, 'dev/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed only to attach the APK to a GitHub Release on tags

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      # Optional stable signing key. Add four repository secrets to enable it:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the build falls back to the debug key (still installable).
      - name: Restore release keystore (if secrets exist)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore restored."
          else
            echo "No release keystore secret; using the debug signing key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK
        run: |
          mkdir -p dist
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "dist/SMS-and-call-${VERSION}-build${{ github.run_number }}.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SMS-and-call-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
